<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softvim Browser</title>
    <link rel="stylesheet" href="styles/theme.css">
    <style>
        /* New Tab Page — Milestone 1 placeholder */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .welcome {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }
        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 2rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #007AFF, #5856D6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg {
            width: 36px;
            height: 36px;
            fill: white;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }
        .version {
            margin-top: 2rem;
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="welcome">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="2" x2="12" y2="22"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
        </div>
        <h1>Softvim Browser</h1>
        <p>A premium browsing experience.</p>
        <div class="version">v0.1.0 — Pre-Alpha</div>
    </div>
</body>
</html>
