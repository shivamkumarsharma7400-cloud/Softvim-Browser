<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softvim Browser</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/toolbar.css">
    <link rel="stylesheet" href="styles/panels.css">
</head>
<body>
    <header class="browser-chrome">
        <!-- Compact Safari Tab Bar -->
        <div class="tab-bar">
            <div class="tab active" data-tab-id="1">
                <svg class="tab-favicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                <span class="tab-title">New Tab</span>
                <span class="tab-close">
                    <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="2.5" fill="none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </span>
            </div>
            <div class="new-tab-btn" title="New Tab">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
        </div>

        <!-- Navigation & Safari Centered Address Bar -->
        <div class="nav-bar">
            <div class="nav-group">
                <button class="action-btn" id="btn-back" title="Back" disabled>
                    <svg viewBox="0 0 24 24">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="action-btn" id="btn-forward" title="Forward" disabled>
                    <svg viewBox="0 0 24 24">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
                <button class="action-btn" id="btn-reload" title="Reload">
                    <svg viewBox="0 0 24 24">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>

            <!-- Centered Rounded Address Field -->
            <div class="address-bar-container">
                <div class="address-bar">
                    <span class="address-icon">
                        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="text" class="address-input" id="address-input" placeholder="Search or enter website name" spellcheck="false" autocomplete="off" />
                    <!-- Bookmark Action -->
                    <button class="action-btn" id="btn-add-bookmark" title="Bookmark Page" style="width:24px; height:24px;">
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Safari-Style Controls (Bookmarks, History, Downloads, Theme) -->
            <div class="nav-group">
                <button class="action-btn" id="btn-bookmarks" title="Bookmarks">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <button class="action-btn" id="btn-history" title="History">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </button>
                <button class="action-btn" id="btn-downloads" title="Downloads">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button class="action-btn" id="btn-theme" title="Toggle Appearance">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Slide-out Sidebar Panel -->
    <aside class="sidebar-overlay" id="sidebar-panel">
        <div class="sidebar-header">
            <span class="sidebar-title" id="sidebar-title">Bookmarks</span>
            <button class="sidebar-close" id="sidebar-close">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Dynamically populated via app.js -->
        </div>
    </aside>

    <script src="scripts/app.js"></script>
</body>
</html>
