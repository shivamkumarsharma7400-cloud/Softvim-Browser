name: Build and Package Softvim Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache CEF Binary Framework
        uses: actions/cache@v4
        id: cef-cache
        with:
          path: third_party/cef
          key: cef-${{ hashFiles('CMakeLists.txt') }}-windows64

      - name: Configure CMake
        shell: pwsh
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DUSE_SANDBOX=OFF `
            ..

      - name: Build Application
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} -j 4

      - name: Stage Distribution Files
        shell: pwsh
        run: |
          $distDir = "dist/SoftvimBrowser"
          mkdir $distDir -Force

          $outPath = "build/bin/${{ env.BUILD_TYPE }}"
          if (!(Test-Path $outPath)) {
              $exe = Get-ChildItem -Path build -Recurse -Filter "SoftvimBrowser.exe" | Select-Object -First 1
              $outPath = $exe.DirectoryName
          }

          Copy-Item "$outPath/*" $distDir -Recurse -Force
          # Explicitly ensure custom UI and branding files are present in the distribution
          Copy-Item "resources/ui" "$distDir/ui" -Recurse -Force
          Copy-Item "resources/softvim.ico" "$distDir/softvim.ico" -Force
          Copy-Item "resources/softvim_icon.png" "$distDir/softvim_icon.png" -Force
          Write-Host "Staged application directory successfully."

          # Create a fast portable zip for instant download
          Compress-Archive -Path "$distDir/*" -DestinationPath "dist/SoftvimBrowser-v0.1.0-Portable-x64.zip" -Force

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
              mkdir dist/Installer -Force
              & $iscc "resources/installer.iss"
              Write-Host "Inno Setup installer created successfully."
          } else {
              Write-Warning "ISCC.exe not found on runner."
          }

      - name: Upload Standalone Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoftvimBrowser-Standalone-x64
          path: dist/SoftvimBrowser/
          retention-days: 14

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoftvimBrowser-Installer-x64
          path: dist/Installer/
          retention-days: 14

      - name: Publish High-Speed GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          name: "Softvim Browser v0.1.0 Preview (Windows x64)"
          body: |
            ## Softvim Browser v0.1.0 Preview
            Lightweight, Safari-inspired Chromium desktop browser for Windows.
            
            ### High-Speed Direct Downloads (No Throttling):
            - **Windows Installer (Setup .exe)**: `SoftvimBrowser_Setup_x64.exe`
            - **Portable Zip**: `SoftvimBrowser-v0.1.0-Portable-x64.zip`
            
            *Directly hosted on GitHub's global Azure CDN edge network for maximum download speed.*
          files: |
            dist/Installer/SoftvimBrowser_Setup_x64.exe
            dist/SoftvimBrowser-v0.1.0-Portable-x64.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
